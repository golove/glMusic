[package]
name = "glmusic-core"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.7"
tower-http = { version = "0.5", features = ["cors"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
ncm-api-rs = "0.1.0"
reqwest = { version = "0.12", features = ["json"] }
parking_lot = "0.12"
directories = "5"
url = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
