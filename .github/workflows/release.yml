name: Build & Release glMusic (Windows)

on:
  push:
    branches: [main, master, rust]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows Flutter + Rust Native Client
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust Stable (MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Build Rust Backend Core (glmusic-core)
        shell: bash
        run: |
          cd glmusic_flutter/rust
          cargo build --release

      - name: Build Flutter Windows Desktop
        shell: bash
        run: |
          cd glmusic_flutter
          flutter config --enable-windows-desktop
          flutter pub get
          flutter build windows --release

      - name: Bundle Rust Core & Package App
        shell: bash
        run: |
          # Find release folder containing glmusic.exe
          RELEASE_DIR="glmusic_flutter/build/windows/x64/runner/Release"
          if [ ! -d "$RELEASE_DIR" ]; then
            RELEASE_DIR=$(find glmusic_flutter/build/windows -type f -name "glmusic.exe" -exec dirname {} \; | head -n 1)
          fi
          echo "Target Release directory: $RELEASE_DIR"

          # Copy glmusic-core.exe next to glmusic.exe
          cp glmusic_flutter/rust/target/release/glmusic-core.exe "$RELEASE_DIR/"

          # Compress Release folder to zip located in root GITHUB_WORKSPACE
          cd "$RELEASE_DIR"
          7z a -tzip -mx=9 "$GITHUB_WORKSPACE/glmusic-windows-x64.zip" *
          
          # Verify file exists
          ls -lh "$GITHUB_WORKSPACE/glmusic-windows-x64.zip"

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        if: "!startsWith(github.ref, 'refs/tags/')"
        with:
          name: glmusic-windows-x64
          path: glmusic-windows-x64.zip
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: 'glMusic Windows ${{ github.ref_name }}'
          body: |
            ## glMusic Native Desktop (Flutter + Rust)
            
            - **High Performance**: Native C++ / Skia / Impeller rendering with 120 FPS buttery smooth resizing.
            - **Apple Music HIG**: Authentic macOS aesthetics, 6 dynamic themes, 19 drifting bokeh atmosphere spots.
            - **Rust Core**: Unblock VIP songs, high-res lyrics synchronization, offline persistence.
          files: glmusic-windows-x64.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
