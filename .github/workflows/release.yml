name: Release glMusic

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build and Release glMusic
    runs-on: xcode-27

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode Version
        run: |
          sw_vers
          xcodebuild -version
          xcode-select -p

      - name: Build Release
        run: |
          set -o pipefail
          xcodebuild \
            -project glMusic.xcodeproj \
            -scheme glMusic \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/glMusic-derived" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package ZIP and DMG
        run: |
          set -euo pipefail

          APP_PATH="$RUNNER_TEMP/glMusic-derived/Build/Products/Release/glMusic.app"
          DIST="$RUNNER_TEMP/glMusic-dist"
          STAGE="$DIST/dmg-stage"

          test -d "$APP_PATH"
          mkdir -p "$DIST" "$STAGE"

          ditto -c -k --sequesterRsrc --keepParent \
            "$APP_PATH" "$DIST/glMusic.zip"

          ditto "$APP_PATH" "$STAGE/glMusic.app"
          ln -s /Applications "$STAGE/Applications"

          # 检查 DMG 所需的目录和应用是否存在
          test -d "$STAGE"
          test -d "$STAGE/glMusic.app"

          # 使用新版 diskutil 创建压缩 DMG
          diskutil image create from \
          "$STAGE" \
          "$DIST/glMusic.dmg" \
           --format UDZO

          # 检查 DMG 是否成功生成
          test -s "$DIST/glMusic.dmg"

          # 输出文件信息
          ls -lh "$DIST/glMusic.dmg"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            ${{ runner.temp }}/glMusic-dist/glMusic.zip
            ${{ runner.temp }}/glMusic-dist/glMusic.dmg
