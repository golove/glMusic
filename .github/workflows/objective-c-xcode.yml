name: Xcode - Build and Analyze

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    name: Build and Analyze glMusic
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode Version
        run: |
          sw_vers
          xcodebuild -version
          xcode-select -p

      - name: List Project Schemes
        run: |
          set -o pipefail
          xcodebuild -list -project glMusic.xcodeproj

      - name: Build and Analyze
        run: |
          set -o pipefail
          xcodebuild clean build analyze \
            -project glMusic.xcodeproj \
            -scheme glMusic \
            -destination 'generic/platform=macOS' \
            CODE_SIGNING_ALLOWED=NO
