[package]
name = "glmusic"
version = "0.1.0"
description = "glMusic - Modern Apple Music styled NetEase Cloud Music Client for Windows & Linux"
authors = ["glMusic Team"]
edition = "2021"

[lib]
name = "glmusic_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
ncm-api-rs = "0.1.0"
reqwest = { version = "0.12", features = ["json"] }
parking_lot = "0.12"
directories = "5"
url = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
